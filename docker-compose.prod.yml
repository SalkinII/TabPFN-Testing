services:
  tabpfn:
    # Image from GitHub Container Registry
    # Image will be available at: ghcr.io/SalkinII/TabPFN-Testing:latest
    image: ghcr.io/SalkinII/TabPFN-Testing:latest
    container_name: tabpfn-data-quality
    ports:
      - "5006:5006"
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
      # HF_TOKEN can be set via .env file or environment variable
      # If not set, TabPFN will use statistical fallback methods
      - HF_TOKEN=${HF_TOKEN:-}
    command: panel serve app.py --address 0.0.0.0 --port 5006 --allow-websocket-origin=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5006/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

