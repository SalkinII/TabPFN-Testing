version: '3.8'

services:
  tabpfn-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tabpfn-data-quality-dev
    ports:
      - "5006:5006"
    volumes:
      # Mount local code directory for live updates
      - .:/app
      # Mount logs directory for easy access
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=development
      # HF_TOKEN will be loaded from .env file if it exists
      # If not set, TabPFN will fall back to statistical methods
    command: panel serve app.py --address 0.0.0.0 --port 5006 --allow-websocket-origin=* --show
    restart: unless-stopped

